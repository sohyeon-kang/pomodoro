<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a3a6a8"><meta name="description" content="Pomodoro. 나에게 맞는 시간으로, 하나에 집중하세요.">
  <title>Pomodoro</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css">
</head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
  <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M9 2h6M12 5V2m0 7v5l3 2M18 6l2-2"/></symbol>
  <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19h16M7 15v-4m5 4V5m5 10V8"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="m3 6 1.5 1.5L7 4m3 2h11M3 13l1.5 1.5L7 11m3 2h11M3 20l1.5 1.5L7 18m3 2h11"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.5 3-.7 2.3-2 .9-2.2-.5-2.4 4.1 1.5 1.8v2.3l-1.5 1.8 2.4 4.1 2.2-.5 2 .9.7 2.3h5l.7-2.3 2-.9 2.2.5 2.4-4.1-1.5-1.8v-2.3l1.5-1.8-2.4-4.1-2.2.5-2-.9L14.5 3Z"/><circle cx="12" cy="12.7" r="3"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14" stroke-width="4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="m15 4 5 5M4 20l5-1L21 7a2 2 0 0 0-5-5L4 14Z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5Zm5 4a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
  <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C8 2 1 10 7 17s16 0 13-14ZM4 21 15 10"/></symbol>
  <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 2c2 6-5 7-3 11 2-1 3-3 3-3s5 3 5 7a5 5 0 0 1-10 0C1 14 8 7 12 2Z"/></symbol>
</defs></svg>
<div class="app-shell">
  <header class="app-header">
    <a class="brand" href="#timer" aria-label="Pomodoro 홈"><svg><use href="#i-timer"/></svg><span>Pomodoro</span></a>
    <div class="header-actions">
      <button class="icon-button" data-view="records" aria-label="기록 및 할 일" title="기록 및 할 일"><svg><use href="#i-chart"/></svg></button>
      <button class="icon-button" id="fullscreen-toggle" aria-label="전체 화면" title="전체 화면"><svg><use href="#i-expand"/></svg></button>
      <button class="icon-button" id="settings-open" aria-label="설정" title="설정"><svg><use href="#i-settings"/></svg></button>
    </div>
  </header>
  <main id="view-timer" class="timer-stage" aria-label="집중 타이머">
    <div class="mode-tabs" role="tablist" aria-label="타이머 종류">
      <button role="tab" aria-selected="true" data-mode="focus" class="selected">집중</button><button role="tab" aria-selected="false" data-mode="short">짧은 휴식</button><button role="tab" aria-selected="false" data-mode="long">긴 휴식</button>
    </div>
    <div class="timer-face"><h1 id="dial-label">집중 시간</h1><div class="time-display" id="time-display" role="timer" aria-label="25분 0초">25<span>:</span>00</div><button class="duration-edit" id="duration-edit" aria-label="시간 변경"><span id="duration-summary">25분 · 시간 변경</span><svg><use href="#i-edit"/></svg></button></div>
    <div class="timer-controls"><button class="primary-button" id="start-pause"><svg><use href="#i-play"/></svg><span>시작</span></button><button class="reset-button icon-button" id="reset-timer" aria-label="타이머 초기화" title="초기화"><svg><use href="#i-reset"/></svg></button></div>
    <div class="session-status"><div class="session-dots" id="session-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div><span class="session-counter" id="session-counter">0 / 4</span><span id="session-caption" class="sr-only">긴 휴식까지 4번의 집중</span></div>
    <span id="ready-label" class="sr-only" role="status">준비됨</span><div class="timer-progress-track" aria-hidden="true"><div id="dial-progress"></div></div>
  </main>
  <footer class="app-footer"><span class="keyboard-hint"><kbd>space</kbd> 시작 / 일시정지</span><button class="today-summary" data-view="records" aria-label="오늘의 집중 기록 보기"><span>오늘</span><strong id="today-time">0<small>분</small></strong><span class="summary-divider"></span><strong id="today-sessions">0<small>회</small></strong><svg><use href="#i-arrow"/></svg></button></footer>
</div>
<dialog id="duration-dialog" aria-labelledby="duration-title">
  <div class="dialog-heading"><h2 id="duration-title">집중 시간</h2><button type="button" class="icon-button" data-close-dialog aria-label="시간 설정 닫기"><svg><use href="#i-close"/></svg></button></div>
  <section id="duration-card" class="duration-card"><p class="dialog-description">나에게 맞는 시간을 선택하세요.</p>
    <div class="duration-stepper"><button class="stepper-button" id="duration-minus" aria-label="집중 시간 5분 줄이기"><svg><use href="#i-minus"/></svg></button><div class="duration-number"><input type="number" id="duration-input" min="1" max="180" value="25" aria-label="집중 시간 (분)"><span>분</span></div><button class="stepper-button" id="duration-plus" aria-label="집중 시간 5분 늘리기"><svg><use href="#i-plus"/></svg></button></div>
    <input type="range" id="duration-range" min="1" max="180" value="25" aria-label="집중 시간 조절"><div class="range-labels"><span>1분</span><span>180분</span></div>
    <div class="duration-presets" aria-label="집중 시간 빠른 선택"><button data-minutes="15">15분</button><button data-minutes="25" class="selected">25분</button><button data-minutes="45">45분</button><button data-minutes="60">60분</button></div><p id="duration-note" class="duration-note">25분 집중 · 5분 휴식</p><button type="button" class="primary-button dialog-save" data-close-dialog>완료</button>
  </section>
</dialog>
<dialog id="library-dialog" class="library-dialog" aria-labelledby="breadcrumb-current">
  <div class="dialog-heading"><h2 id="breadcrumb-current">기록</h2><button type="button" class="icon-button" data-close-dialog aria-label="기록 닫기"><svg><use href="#i-close"/></svg></button></div>
  <nav class="library-tabs" aria-label="기록 메뉴"><button data-view="records" class="active">집중 기록</button><button data-view="tasks">할 일 <span id="task-count">0</span></button></nav>
  <section id="view-records" class="library-view" aria-label="나의 기록" hidden>
    <div class="record-summary"><div class="metric"><span>오늘 집중</span><strong id="record-time">0분</strong></div><div class="metric"><span>오늘 완료</span><strong id="record-sessions">0회</strong></div><div class="metric"><span>전체 완료</span><strong id="record-total">0회</strong></div></div>
    <div class="goal-label"><span>오늘의 목표</span><strong id="goal-caption">0 / 4 세션</strong></div><div class="goal-track"><div id="goal-progress"></div></div><p id="goal-message" class="sr-only"></p>
    <section class="chart-card"><div class="section-title"><h3>최근 7일</h3><span>완료한 집중 시간 · 분</span></div><div id="week-chart" class="week-chart"></div></section><section class="history-card"><div class="section-title"><h3>집중 기록</h3><button class="text-button" id="export-records">CSV 내보내기</button></div><div id="history-list"></div></section>
  </section>
  <section id="view-tasks" class="library-view" aria-label="할 일" hidden>
    <form id="task-form" class="task-form"><input id="task-input" maxlength="160" placeholder="집중할 일 추가" aria-label="새 할 일" required><button class="primary-button" type="submit" aria-label="할 일 추가"><svg><use href="#i-plus"/></svg></button></form><div class="task-filter-row"><h3>할 일</h3><span id="task-progress">0개 완료</span></div><div id="task-list"></div>
    <form id="quick-task-form" hidden><input id="quick-task-input" maxlength="160" aria-label="집중할 일"><button type="submit">추가</button></form><div id="active-task-row" class="active-task-row" hidden></div>
  </section>
</dialog>
<dialog id="settings-dialog" aria-labelledby="settings-title">
  <form id="settings-form"><div class="dialog-heading"><h2 id="settings-title">설정</h2><button type="button" class="icon-button" data-close-dialog aria-label="설정 닫기"><svg><use href="#i-close"/></svg></button></div>
    <div class="settings-group"><label class="setting-row"><span>짧은 휴식</span><span class="setting-input"><input id="short-duration" type="number" min="1" max="60" required><span>분</span></span></label><label class="setting-row"><span>긴 휴식<small>집중 4회 완료 후</small></span><span class="setting-input"><input id="long-duration" type="number" min="1" max="60" required><span>분</span></span></label><label class="setting-row"><span>하루 목표</span><span class="setting-input"><input id="daily-goal" type="number" min="1" max="24" required><span>회</span></span></label></div>
    <div class="settings-group"><label class="setting-row"><span>완료 알림음</span><input class="switch" id="sound-enabled" type="checkbox" role="switch"></label><label class="setting-row"><span>휴식 자동 시작</span><input class="switch" id="auto-break" type="checkbox" role="switch"></label><div class="setting-row"><span>화면 테마</span><button type="button" class="icon-button theme-toggle" id="theme-toggle" aria-label="어두운 테마로 전환" title="테마 변경"><svg><use href="#i-sun"/></svg></button></div></div>
    <p class="settings-footnote">설정과 기록은 이 브라우저에 저장됩니다.<br>탭을 닫으면 알림음은 울리지 않습니다.</p><button class="primary-button dialog-save" type="submit">저장</button>
  </form>
</dialog>
<dialog id="confirm-dialog" aria-labelledby="confirm-title"><div class="dialog-heading"><h2 id="confirm-title">타이머를 변경할까요?</h2></div><p id="confirm-description" class="dialog-description"></p><div class="dialog-actions"><button class="secondary-button" id="confirm-cancel">취소</button><button class="primary-button" id="confirm-ok">변경</button></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
